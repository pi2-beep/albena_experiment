services:
  - type: web
    name: experiment-albena
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_VERSION
        value: 1.4.1
      - key: SECRET_KEY
        generateValue: true
      - key: RESULTS_ARCHIVE_BACKEND
        value: ftp
      - key: RESULTS_FTP_HOST
        sync: false
      - key: RESULTS_FTP_PORT
        value: "21"
      - key: RESULTS_FTP_USERNAME
        sync: false
      - key: RESULTS_FTP_PASSWORD
        sync: false
      - key: RESULTS_FTP_DIRECTORY
        value: /albena-results
      - key: RESULTS_FTP_TLS
        value: "true"
      - key: RESULTS_FTP_TLS_SERVER_NAME
        sync: false
      - key: RESULTS_FTP_PASSIVE
        value: "true"
